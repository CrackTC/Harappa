name: Process GTX Files

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  workflow_dispatch:

jobs:
  process-gtx:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Fetch files from Paratranz and generate GTX files
        run: dotnet build/FetchParatranz.cs ${{ secrets.PARATRANZ_TOKEN }} gtx

      - name: Check for changes and upload to Cloudflare R2
        run: |
          CHANGED_FILES=$(git status --porcelain gtx/ | awk '{print $2}' | base64 -w 0)

          # Configure AWS CLI for Cloudflare R2
          aws configure set aws_access_key_id ${{ secrets.R2_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws configure set region auto

          # Upload only changed gtx files to R2
          for file in $(echo $CHANGED_FILES | base64 -d); do
            if [ -f "$file" ]; then
              aws s3 cp "$file" s3://${{ secrets.R2_BUCKET_NAME }}/ \
                --endpoint-url ${{ secrets.R2_ENDPOINT_URL }}
              echo "Uploaded: $file"
            fi
          done
          echo "Changed files uploaded to Cloudflare R2"

      - name: Commit and push changes
        run: |
          if [ -n "$(git status --porcelain gtx/)" ]; then
             echo "Changes detected in GTX files. Committing and pushing to GitHub."
             git add gtx/
             git commit -m "Update GTX files from Paratranz"
             git push origin HEAD:main
          else
             echo "No changes detected in GTX files. Skipping commit and push."
          fi
